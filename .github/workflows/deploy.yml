name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages. Runs on pushes to the
# development branch and can also be triggered manually from the Actions tab.
on:
  push:
    branches:
      - claude/bank-statement-analyzer-nwrjf2
  workflow_dispatch:

# Permissions needed for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-progress deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Public OAuth client IDs (not secrets — see cloud sync docs),
          # picked up from repo Settings → Secrets and variables → Actions →
          # Variables. Left unset, both providers just show "Not set up yet".
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}

      # Enables Pages (build type = GitHub Actions) on first run, no manual
      # repo-settings step required.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
